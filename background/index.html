<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>background — Webdesign Trials</title>
<meta name="description" content="Four ways to make pure black stop being flat.">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --fg: #f0eee8;
    --muted: #7d7b73;
    --line: #262624;
    --accent: #e0794f;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Courier New", monospace;

    /* --- what the backgrounds are made of. the panel writes these. --- */
    --m1: #e0794f;        /* the three mesh blobs      */
    --m2: #3a5684;
    --m3: #783c6e;
    --mesh-alpha: .30;    /* blob strength             */
    --mesh-size: 1;       /* blob radius multiplier    */
    --mesh-blur: 28px;
    --mesh-b: .65;        /* second layer's opacity    */
    --drift-a: 26s;       /* the two drift periods,    */
    --drift-b: 37s;       /* counter-phase             */
    --drift-amp: .14;     /* how far the drift zooms   */
    --grain-alpha: .16;
    --grain-rate: 700ms;  /* resample interval         */
    --grain-combo: .13;   /* noise opacity over mesh   */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 18px/1.65 "Times New Roman", Times, serif;
    text-transform: lowercase;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    cursor: pointer;
  }

  /* --- the stage: stacked background layers, one shown at a time --- */
  .stage { position: fixed; inset: 0; background: var(--bg); }
  .layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 900ms ease;
  }
  .layer[data-active] { opacity: 1; }
  /* effects are stacked inside a layer, so they can be combined */
  .fx { position: absolute; inset: 0; }

  /* void: nothing at all, the control case */

  /* mesh: overlapping radials, slowly drifting */
  .mesh::before, .mesh::after {
    content: "";
    position: absolute;
    inset: -25%;
    background:
      radial-gradient(calc(38% * var(--mesh-size)) calc(38% * var(--mesh-size)) at 28% 32%,
        color-mix(in srgb, var(--m1) calc(var(--mesh-alpha) * 100%), transparent), transparent 70%),
      radial-gradient(calc(42% * var(--mesh-size)) calc(42% * var(--mesh-size)) at 72% 66%,
        color-mix(in srgb, var(--m2) calc(var(--mesh-alpha) * 100%), transparent), transparent 70%),
      radial-gradient(calc(34% * var(--mesh-size)) calc(34% * var(--mesh-size)) at 62% 22%,
        color-mix(in srgb, var(--m3) calc(var(--mesh-alpha) * 73%), transparent), transparent 70%);
    filter: blur(var(--mesh-blur));
    animation: drift var(--drift-a) ease-in-out infinite alternate;
  }
  .mesh::after {
    animation-duration: var(--drift-b);
    animation-direction: alternate-reverse;
    opacity: var(--mesh-b);
  }
  @keyframes drift {
    from { transform: translate3d(-4%, -3%, 0) scale(1); }
    to   { transform: translate3d(5%, 4%, 0) scale(calc(1 + var(--drift-amp))); }
  }

  /* grain: fractal noise; transparent, so it can sit on top of the mesh.
     the tile is built in js, since baseFrequency lives inside the data uri. */
  .grain::before {
    content: "";
    position: absolute;
    inset: -100%;
    background-image: var(--grain-url);
    opacity: var(--grain-alpha);
    animation: shift var(--grain-rate) steps(1) infinite;
  }
  @keyframes shift {
    0%   { transform: translate3d(0, 0, 0); }
    25%  { transform: translate3d(-3%, 2%, 0); }
    50%  { transform: translate3d(2%, -3%, 0); }
    75%  { transform: translate3d(-2%, -2%, 0); }
    100% { transform: translate3d(3%, 1%, 0); }
  }

  /* mesh + grain: the two above, stacked — grain last, so it sits on top */
  .meshgrain .grain::before { opacity: var(--grain-combo); }


  /* --- chrome --- */
  .chrome {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem clamp(1.5rem, 5vw, 3.5rem);
    pointer-events: none;
  }
  .chrome a { pointer-events: auto; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
  .back {
    font-family: var(--mono);
    font-size: .85rem;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: .06em;
  }
  .back:hover { color: var(--accent); }
  .count {
    font-family: var(--mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .12em;
    font-size: .85rem;
  }
  h1 {
    margin: 0;
    font-family: var(--mono);
    font-weight: 400;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    line-height: 1.15;
    letter-spacing: -0.03em;
  }
  .name { color: var(--accent); }
  .note {
    margin: .35rem 0 0;
    color: var(--muted);
    max-width: 30rem;
  }
  .hint {
    font-family: var(--mono);
    color: var(--muted);
    font-size: .8rem;
    letter-spacing: .1em;
    white-space: nowrap;
  }
  @media (max-width: 34rem) {
    .hint { display: none; }
  }
  /* --- the panel --- */
  .panel {
    position: fixed;
    z-index: 10;
    right: 1rem;
    bottom: 1rem;
    width: 16.5rem;
    max-height: min(78vh, 40rem);
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,.93);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .02em;
    cursor: auto;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem .7rem;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
  .panel-head .title { flex: 1; color: var(--accent); }
  .panel button {
    appearance: none;
    background: none;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--muted);
    font: inherit;
    padding: .18rem .45rem;
    cursor: pointer;
  }
  .panel button:hover { color: var(--accent); border-color: var(--accent); }
  .panel-body { overflow-y: auto; padding: .5rem .7rem .8rem; }
  .panel[data-folded] .panel-body { display: none; }
  .group {
    color: var(--muted);
    opacity: .65;
    margin: .7rem 0 .35rem;
    letter-spacing: .14em;
  }
  .group:first-child { margin-top: .2rem; }
  .ctrl { margin-bottom: .55rem; }
  .ctrl .row {
    display: flex;
    justify-content: space-between;
    gap: .5rem;
    align-items: center;
    color: var(--fg);
  }
  .ctrl output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .swatches { display: flex; gap: .4rem; }
  .ctrl input[type=color] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 1.4rem;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: none;
    cursor: pointer;
  }
  .ctrl input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  .ctrl input[type=color]::-webkit-color-swatch { border: 0; border-radius: 1px; }
  .ctrl input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 1rem;
    margin: .1rem 0 0;
    background: none;
    cursor: pointer;
  }
  .ctrl input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .ctrl input[type=range]::-moz-range-track { height: 1px; background: var(--line); }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px; height: 9px; margin-top: -4px;
    border-radius: 50%; background: var(--accent);
  }
  .ctrl input[type=range]::-moz-range-thumb {
    width: 9px; height: 9px; border: 0;
    border-radius: 50%; background: var(--accent);
  }
  @media (max-width: 46rem) {
    .panel { right: .75rem; left: .75rem; bottom: .75rem; width: auto; max-height: 45vh; }
  }

  /* nothing off-screen should be animating */
  .layer:not([data-active]) * { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .layer, .mesh::before, .mesh::after, .grain::before {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="layer" data-active></div>
    <div class="layer"><div class="fx mesh"></div></div>
    <div class="layer"><div class="fx grain"></div></div>
    <div class="layer meshgrain"><div class="fx mesh"></div><div class="fx grain"></div></div>
  </div>

  <div class="chrome">
    <div class="top">
      <a class="back" href="../../">← trials</a>
      <span class="count" id="count">01 / 04</span>
    </div>
    <div class="bottom">
      <div>
        <h1><span class="name" id="name">void</span></h1>
        <p class="note" id="note">#000, nothing over it.</p>
      </div>
      <span class="hint">click · ← →</span>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="panel-head">
      <span class="title">background</span>
      <button id="reset" type="button">reset</button>
      <button id="fold" type="button" aria-expanded="true">hide</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

<script>
  const treatments = [
    ["void",         "#000, nothing over it."],
    ["mesh",         "3 radial gradients, blurred, drifting counter-phase."],
    ["grain",        "feTurbulence fractal noise, resampled on a step timer."],
    ["mesh + grain", "Mesh under noise, noise dropped for the pairing."]
  ];

  const layers = [...document.querySelectorAll(".layer")];
  const nameEl = document.getElementById("name");
  const noteEl = document.getElementById("note");
  const countEl = document.getElementById("count");
  let i = 0;

  function show(next) {
    i = (next + treatments.length) % treatments.length;
    layers.forEach((l, n) => l.toggleAttribute("data-active", n === i));
    nameEl.textContent = treatments[i][0];
    noteEl.textContent = treatments[i][1];
    countEl.textContent = String(i + 1).padStart(2, "0") + " / " + String(treatments.length).padStart(2, "0");
  }

  // the page advances on any click and on the arrows, so the panel has to be
  // carved out of both — otherwise dragging a slider also cycles the treatment
  document.body.addEventListener("click", (e) => {
    if (e.target.closest("a, .panel")) return;
    show(i + 1);
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest(".panel")) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(i + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); show(i - 1); }
  });

  // ---- panel ------------------------------------------------------------
  const PARAMS = [
    { g:"mesh",  k:"mesh-blur",   l:"blur",        min:0,  max:90,  step:1,   def:28,  u:"px", css:"px" },
    { g:"mesh",  k:"mesh-size",   l:"blob size",   min:.3, max:2.5, step:.05, def:1,   u:"×"  },
    { g:"mesh",  k:"mesh-alpha",  l:"strength",    min:0,  max:.9,  step:.01, def:.30, u:""   },
    { g:"mesh",  k:"mesh-b",      l:"2nd layer",   min:0,  max:1,   step:.01, def:.65, u:""   },
    { g:"mesh",  k:"drift-a",     l:"drift a",     min:3,  max:90,  step:1,   def:26,  u:"s", css:"s" },
    { g:"mesh",  k:"drift-b",     l:"drift b",     min:3,  max:90,  step:1,   def:37,  u:"s", css:"s" },
    { g:"mesh",  k:"drift-amp",   l:"drift zoom",  min:0,  max:.8,  step:.01, def:.14, u:""   },
    { g:"grain", k:"grain-alpha", l:"strength",    min:0,  max:.6,  step:.01, def:.16, u:""   },
    { g:"grain", k:"grain-rate",  l:"resample",    min:60, max:3000,step:20,  def:700, u:"ms", css:"ms" },
    { g:"grain", k:"freq",        l:"frequency",   min:.05,max:2,   step:.05, def:.85, u:""   },
    { g:"grain", k:"oct",         l:"octaves",     min:1,  max:5,   step:1,   def:3,   u:""   },
    { g:"both",  k:"grain-combo", l:"noise / mesh",min:0,  max:.6,  step:.01, def:.13, u:""   }
  ];
  const COLOURS = [
    { k:"m1", l:"blob 1", def:"#e0794f" },
    { k:"m2", l:"blob 2", def:"#3a5684" },
    { k:"m3", l:"blob 3", def:"#783c6e" }
  ];

  const root = document.documentElement;
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panelBody");
  const ui = {};
  const CFG = {};
  for (const p of PARAMS) CFG[p.k] = p.def;
  for (const c of COLOURS) CFG[c.k] = c.def;

  // baseFrequency and numOctaves live inside the noise tile's data uri, so the
  // tile has to be rebuilt whenever either moves
  function grainTile() {
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>" +
      "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='" + CFG.freq +
      "' numOctaves='" + CFG.oct + "' stitchTiles='stitch'/></filter>" +
      "<rect width='240' height='240' filter='url(#n)'/></svg>";
    root.style.setProperty("--grain-url", 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
  }

  function apply(k) {
    if (k === "freq" || k === "oct") { grainTile(); return; }
    const p = PARAMS.find(p => p.k === k);
    root.style.setProperty("--" + k, CFG[k] + (p && p.css ? p.css : ""));
  }

  const fmt = (p, v) => (p.step < 1 ? (+v).toFixed(2).replace(/\.?0+$/, "") : v) + p.u;

  let lastGroup = null;
  for (const p of PARAMS) {
    if (p.g !== lastGroup) {
      const h = document.createElement("div");
      h.className = "group";
      h.textContent = p.g;
      panelBody.appendChild(h);
      lastGroup = p.g;
    }
    const wrap = document.createElement("div");
    wrap.className = "ctrl";
    wrap.innerHTML =
      '<div class="row"><label for="c_' + p.k + '">' + p.l + '</label><output></output></div>' +
      '<input id="c_' + p.k + '" type="range" autocomplete="off" min="' + p.min + '" max="' + p.max +
      '" step="' + p.step + '" value="' + p.def + '">';
    panelBody.appendChild(wrap);

    const input = wrap.querySelector("input");
    const out = wrap.querySelector("output");
    ui[p.k] = { input, out, p };
    input.addEventListener("input", () => {
      CFG[p.k] = +input.value;
      out.textContent = fmt(p, +input.value);
      apply(p.k);
    });
  }

  const colourHead = document.createElement("div");
  colourHead.className = "group";
  colourHead.textContent = "colour";
  panelBody.appendChild(colourHead);

  for (const c of COLOURS) {
    const wrap = document.createElement("div");
    wrap.className = "ctrl";
    wrap.innerHTML =
      '<div class="row"><label for="c_' + c.k + '">' + c.l + '</label></div>' +
      '<input id="c_' + c.k + '" type="color" autocomplete="off" value="' + c.def + '">';
    panelBody.appendChild(wrap);

    const input = wrap.querySelector("input");
    ui[c.k] = { input, c };
    input.addEventListener("input", () => {
      CFG[c.k] = input.value;
      root.style.setProperty("--" + c.k, input.value);
    });
  }

  // browsers restore form state on reload and bfcache, which would leave the
  // widgets showing one thing while the page is drawn from another
  function syncUI() {
    for (const p of PARAMS) {
      ui[p.k].input.value = CFG[p.k];
      ui[p.k].out.textContent = fmt(p, CFG[p.k]);
      apply(p.k);
    }
    for (const c of COLOURS) {
      ui[c.k].input.value = CFG[c.k];
      root.style.setProperty("--" + c.k, CFG[c.k]);
    }
    grainTile();
  }

  document.getElementById("reset").addEventListener("click", () => {
    for (const p of PARAMS) CFG[p.k] = p.def;
    for (const c of COLOURS) CFG[c.k] = c.def;
    syncUI();
  });

  document.getElementById("fold").addEventListener("click", (e) => {
    const folded = panel.toggleAttribute("data-folded");
    e.target.textContent = folded ? "show" : "hide";
    e.target.setAttribute("aria-expanded", String(!folded));
  });

  window.addEventListener("pageshow", syncUI);
  syncUI();
</script>
</body>
</html>
